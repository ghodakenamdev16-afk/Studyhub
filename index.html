<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>StudyHub</h1>

        <h2 id="welcome">
            Welcome Student
        </h2>

        <p class="subtitle">
            Your learning journey starts here.
        </p>

        <button id="loginBtn">
            Logout
        </button>

    </div>

</div>

<script type="module">

import {
    auth,
    onAuthStateChanged,
    signOut
} from "./firebase.js";

const welcome =
    document.getElementById("welcome");

onAuthStateChanged(auth, (user) => {

    if (user) {

        welcome.textContent =
            "Welcome, " +
            (user.displayName || "Student");

    } else {

        window.location.href = "login.html";

    }

});

document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

        await signOut(auth);

        window.location.href = "login.html";

    });

</script>

</body>

</html>
